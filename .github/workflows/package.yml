# Unsigned bundles for macOS and Windows.
#
# Deliberately stops short of signing. Notarising a .app needs an Apple
# Developer account and an app-specific password; an installer Windows will run
# without a warning needs a code-signing certificate. Both are credentials that
# belong to whoever ships the thing, not to a workflow file in the repository,
# and adding them is a decision with a bill attached. What this produces is the
# part that can be made without either: a bundle that runs on a machine where
# the user has said it may.
#
# The Linux build is not here. That is the Flatpak, which has its own manifest
# and its own repository of record.
name: package

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Flatpak manifest pins a tag and a commit together so a moved tag cannot
  # change what Flathub builds, and it shipped with the commit as forty zeros —
  # which either fails the build or quietly falls back to the tag, voiding the
  # guarantee. Checked here rather than in CI because the placeholder is only
  # wrong at the point something is released.
  #
  # And on a release only, which is what that sentence always meant. A manual
  # run is how the macOS and Windows bundles get built for testing, and the
  # placeholder is not wrong then — nothing is being released. Left ungated it
  # failed every dispatch, which is three red runs in the Actions list saying
  # nothing, and a guard nobody reads is a guard nobody will believe when it
  # does mean something.
  manifest:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Flatpak manifest is not carrying a placeholder
        run: |
          m=packaging/blue.azzurro.Azzurro.yml
          if grep -qE 'commit:[[:space:]]*0{40}' "$m"; then
            echo "::error file=$m::commit is still the all-zeros placeholder"
            exit 1
          fi
          grep -qE 'commit:[[:space:]]*[0-9a-f]{40}' "$m" || {
            echo "::error file=$m::no full-length commit pin found"
            exit 1
          }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Both architectures, so one bundle serves an Intel Mac and an Apple
          # Silicon one. A Mac will not run the wrong slice.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      - name: Build both architectures
        run: |
          cargo build --locked --release -p azzurro-gui --target aarch64-apple-darwin
          cargo build --locked --release -p azzurro-gui --target x86_64-apple-darwin

      - name: Assemble the bundle
        run: bash packaging/macos-bundle.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azzurro-macos-unsigned
          path: dist/Azzurro.app
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      - name: Build
        run: cargo build --locked --release -p azzurro-gui

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azzurro-windows-unsigned
          path: target/release/azzurro.exe
          if-no-files-found: error
