# Build and test on all three platforms.
#
# This is the first thing in the project that runs the code anywhere but a
# Linux desktop. Everything claimed about macOS and Windows so far came from
# `cargo check --target` and reading `cfg` gates, which proves a thing compiles
# and nothing about whether it works. A red run here is worth more than any
# amount of that.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A build that warns is a build that will eventually break; there are none
  # today and that is worth keeping.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1

      # Slint draws through wgpu and winit. Nothing here opens a window — the
      # tests use Slint's headless backend — but the crates still want these
      # present to build.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build
        run: cargo build --locked --workspace

      # The fake player binds a loopback port and the window is headless, so
      # the whole suite runs unattended. Nothing here needs a speaker.
      - name: Test
        run: cargo test --locked --workspace
