# Flatpak manifest for Azzurro.
#
# Flathub builds with no network access, so every crate is declared up front in
# cargo-sources.json (generated from Cargo.lock by packaging/cargo-sources.py)
# and cargo runs --offline against a vendored registry.
app-id: blue.azzurro.Azzurro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: azzurro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/azzurro/cargo

finish-args:
  # Wayland first, X11 as the fallback; shared IPC is what the X11 path needs.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The GUI renders through wgpu (Vulkan). It falls back to a software renderer
  # without a GPU, but that is a fallback, not the plan.
  - --device=dri

  # Not optional, and not only for HTTP. Discovery is a UDP broadcast to
  # 255.255.255.255:11430 on every interface, which needs the host's network
  # namespace rather than a proxied socket; without this the app cannot find a
  # player at all, and can only reach ones added by address.
  - --share=network

  # One MPRIS object per player, so the desktop's media controls and the media
  # keys reach each speaker separately. The suffix carries the process id and a
  # per-player index, hence the wildcard.
  - --own-name=org.mpris.MediaPlayer2.azzurro.*

  # Note what is *not* here: no --filesystem grants at all. The remembered
  # player list and the cover-art cache both live in the app's own directories
  # under ~/.var/app/blue.azzurro.Azzurro, and nothing else is read or
  # written. Signing into a music service and the players' own settings pages
  # are web pages, opened through the desktop's OpenURI portal rather than by
  # this app.

modules:
  - name: azzurro
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose -p azzurro-gui
      - install -Dm755 target/release/azzurro /app/bin/azzurro
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro.desktop
        /app/share/applications/blue.azzurro.Azzurro.desktop
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro.metainfo.xml
        /app/share/metainfo/blue.azzurro.Azzurro.metainfo.xml
      # PNG as well as the SVG. AppStream's catalogue generator rasterises the
      # icon itself and the freedesktop SDK's copy has no SVG loader, so an
      # SVG-only install fails the build with icon-file-read-error. The PNGs
      # are rendered from that same SVG by packaging/icons.sh.
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro-64.png
        /app/share/icons/hicolor/64x64/apps/blue.azzurro.Azzurro.png
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro-128.png
        /app/share/icons/hicolor/128x128/apps/blue.azzurro.Azzurro.png
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro-256.png
        /app/share/icons/hicolor/256x256/apps/blue.azzurro.Azzurro.png
      - install -Dm644 crates/azzurro-gui/desktop/blue.azzurro.Azzurro.svg
        /app/share/icons/hicolor/scalable/apps/blue.azzurro.Azzurro.svg
    sources:
      - type: git
        url: https://github.com/jzbz/azzurro.git
        tag: v0.1.0
        # Pinned alongside the tag so a tag that is later moved cannot change
        # what Flathub builds. Both have to be updated together on a release.
        #
        # This value trails the tag by one commit and always will: the commit a
        # tag names cannot be known while writing the file that commit contains.
        # `release.yml` rewrites this line to `git rev-parse HEAD` before it
        # builds, so what CI ships is the tagged tree regardless; what is
        # written here is what a Flathub submission would use, and it is
        # corrected to the tag's own commit immediately after tagging.
        commit: 9d3ed9ce9fd1f517c972677ef8cb6f07733988c0
      - cargo-sources.json
