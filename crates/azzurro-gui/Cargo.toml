[package]
name = "azzurro-gui"
description = "Slint front end for Azzurro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "azzurro_gui"
path = "src/lib.rs"

[[bin]]
name = "azzurro"
path = "src/main.rs"

[dependencies]
bluos.workspace = true
tokio.workspace = true
reqwest.workspace = true
rustls.workspace = true
image.workspace = true
lru.workspace = true
dirs.workspace = true
open.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# default-features = false keeps two C/C++ dependencies out of the build:
# `backend-qt`, which the selector compiles in whenever qmake is on PATH and
# then prefers over winit at runtime, and `renderer-skia`.
# renderer-femtovg-wgpu draws through wgpu — Vulkan on Linux — instead of
# femtovg's OpenGL path. renderer-software stays enabled as a fallback for
# machines without a usable GPU: SLINT_BACKEND=winit-software.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
] }

# Emphatically NOT the "tokio" feature, however tempting it looks next to the
# runtime this app already has. It sets `zbus/tokio`, and Cargo unifies
# features across the graph onto one zbus — the same zbus that `accesskit_unix`
# uses for AT-SPI. That feature switches zbus's executor to `tokio::spawn`,
# which panics unless it is called inside a runtime, and AccessKit builds its
# connection on the Slint event-loop thread, where there is none. Enabling it
# trades working accessibility for nothing: zbus's default async-io reactor
# drives the MPRIS server perfectly well from a tokio task.
# Linux only. MPRIS is a D-Bus interface: there is no session bus to claim a
# name on under Windows, and macOS has its own Now Playing centre instead. Left
# unconditional it stayed in the dependency graph for both — `cargo tree
# --target x86_64-pc-windows-msvc` pulled zbus in — for a bridge that could
# never do anything there.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
# Already in the tree by way of slint's backend selector, and already in
# packaging/cargo-sources.json, so naming it here costs no download and no
# regeneration of the offline source list.
#
# Its clicks are real: `single_click` dispatches a PointerPressed at the
# element's own centre and the window hit-tests it like any other, so a
# control covered by something else fails here the way it would on screen.
i-slint-backend-testing = "1.17"
