[package]
name = "azzurro-gui"
description = "Slint front end for Azzurro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "azzurro_gui"
path = "src/lib.rs"

[[bin]]
name = "azzurro"
path = "src/main.rs"

[dependencies]
bluos.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# default-features = false keeps two C/C++ dependencies out of the build:
# `backend-qt`, which the selector compiles in whenever qmake is on PATH and
# then prefers over winit at runtime, and `renderer-skia`.
# renderer-femtovg-wgpu draws through wgpu — Vulkan on Linux — instead of
# femtovg's OpenGL path. renderer-software stays enabled as a fallback for
# machines without a usable GPU: SLINT_BACKEND=winit-software.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "renderer-software",
] }

# Emphatically NOT the "tokio" feature, however tempting it looks next to the
# runtime this app already has. It sets `zbus/tokio`, and Cargo unifies
# features across the graph onto one zbus — the same zbus that `accesskit_unix`
# uses for AT-SPI. That feature switches zbus's executor to `tokio::spawn`,
# which panics unless it is called inside a runtime, and AccessKit builds its
# connection on the Slint event-loop thread, where there is none. Enabling it
# trades working accessibility for nothing: zbus's default async-io reactor
# drives the MPRIS server perfectly well from a tokio task.
mpris-server = "0.10"

[build-dependencies]
slint-build = "1.17"
