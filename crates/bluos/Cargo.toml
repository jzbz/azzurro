[package]
name = "bluos"
description = "Discovery and control for BluOS players (Bluesound, NAD, PSB)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bluos", "bluesound", "multiroom", "audio", "lsdp"]
categories = ["multimedia::audio", "network-programming"]

[dependencies]
tokio.workspace = true
reqwest.workspace = true
quick-xml.workspace = true
serde.workspace = true
socket2.workspace = true
percent-encoding.workspace = true
iana-time-zone.workspace = true
if-addrs.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Not a real dependency: this crate never opens a TLS connection. It is here so
# the tests can install the provider that workspace feature unification makes
# reqwest insist on. See the note on `Client::new`.
[dev-dependencies]
rustls.workspace = true
