[workspace]
resolver = "3"
members = ["crates/bluos", "crates/bluos-cli", "crates/azzurro-gui", "crates/fake-player"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jzbz/azzurro"

[workspace.dependencies]
# Versioned as well as pathed so `bluos` can be published on its own: the
# protocol is the part other people need, and it should outlive this GUI.
bluos = { path = "crates/bluos", version = "0.1.0" }

# net for UDP and TCP, time for the long-poll backoff, sync for the channels
# that carry player events to the UI thread. "macros" only for #[tokio::main]
# in the CLI.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
] }

# Players speak plain HTTP on the LAN, but cover art comes from the streaming
# services' own CDNs over https, so TLS cannot be avoided — only chosen
# carefully. `rustls-no-provider` rather than plain `rustls`, because `rustls`
# means aws-lc-rs, which wants cmake and a C toolchain at build time; the
# provider is installed explicitly in azzurro-gui, and it is ring. Certificate
# verification goes through rustls-platform-verifier, so the system trust store
# is used rather than a bundled root list.
# `query` gates RequestBuilder::query, which every control verb uses.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "query",
    "rustls-no-provider",
] }
# Named here only so the ring provider can be installed by hand; nothing else
# in the workspace touches rustls directly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Album art is JPEG, PNG or WebP in practice. default-features would compile a
# decoder for every format the crate knows, which is most of the build time and
# none of the benefit.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
lru = "0.18"
dirs = "6"
# Hands a URL to the desktop's own opener. Music-service sign-in and the
# player's settings pages are web pages served by Lenbrook or by the player, and
# a controller can only point at them.
open = "5"

# "serialize" turns on the serde deserializer, which is what reads /Status and
# /SyncStatus. The server-driven `<screen>` documents are tree-shaped with
# heterogeneous children and will want the pull parser instead; see
# docs/protocol.md.
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }

# SO_REUSEADDR and SO_REUSEPORT on the LSDP socket, which tokio's UdpSocket
# cannot set on its own: it only wraps an already-configured socket.
socket2 = { version = "0.6", features = ["all"] }
# Interface addresses *with netmasks*, which is what the per-interface
# broadcast address is derived from. getifaddrs, no C dependency.
if-addrs = "0.15"

# Only for putting a user's search text into a query string safely.
percent-encoding = "2"
# Already in the tree by way of chrono, which slint pulls, and already in
# packaging/cargo-sources.json — so naming it directly costs no download and no
# regeneration of the offline source list the Flatpak build reads.
iana-time-zone = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# A panic kills the process rather than unwinding.
#
# Not for the code size. The app spawns thirty-odd detached tasks and keeps
# none of their handles, so nothing observes a panic in any of them: unwinding
# ends one task quietly and leaves the rest running. The worst of those is the
# command loop, where it means the window carries on drawing while every
# control is dead — the channel still accepts, and nobody reads. That reads as
# the app being broken in a way nobody can report usefully.
#
# Aborting is louder and more honest: the app is gone, the reason is on stderr,
# and starting it again works. It also retires mutex poisoning as a category,
# since no lock can be left poisoned by an unwind that never happens.
#
# The cost is that any panic anywhere is fatal, including in a dependency. The
# one place this app relied on absorbing one was decoding a cover, which is why
# `artwork::decode` was given explicit limits in the same change.
panic = "abort"
